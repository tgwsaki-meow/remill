name: Package Portable LLVM
on:
  push:
    paths:
      - '.github/workflows/package-llvm.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-llvm:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        llvm:
          - "20"
          - "18"
    steps:
      - name: Install build tools and patchelf
        run: |
          sudo apt update
          sudo apt install -y --no-install-recommends \
            wget \
            lsb-release \
            software-properties-common \
            gnupg \
            patchelf \
            file \
            tar \
            gzip \
            python3

      - name: Install LLVM ${{ matrix.llvm }}
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh ${{ matrix.llvm }} all
          sudo apt update
          sudo apt install -y --no-install-recommends \
            llvm-${{ matrix.llvm }} \
            llvm-${{ matrix.llvm }}-tools \
            llvm-${{ matrix.llvm }}-dev \
            clang-${{ matrix.llvm }} \
            lld-${{ matrix.llvm }}

      - name: Package portable LLVM distribution
        run: |
          LLVM_DIR="/usr/lib/llvm-${{ matrix.llvm }}"
          DIST_NAME="llvm-v${{ matrix.llvm }}-linux-x86_64-portable"
          mkdir -p "dist/${DIST_NAME}"

          # Copy entire llvm tree (bin, lib, include, share)
          cp -r "${LLVM_DIR}/bin" "dist/${DIST_NAME}/"
          cp -r "${LLVM_DIR}/lib" "dist/${DIST_NAME}/"
          if [ -d "${LLVM_DIR}/include" ]; then
            cp -r "${LLVM_DIR}/include" "dist/${DIST_NAME}/"
          fi
          if [ -d "${LLVM_DIR}/share" ]; then
            cp -r "${LLVM_DIR}/share" "dist/${DIST_NAME}/"
          fi

          # 1. Clean up ALL initial dangling symlinks
          echo "Removing initial dangling symlinks..."
          find "dist/${DIST_NAME}" -xtype l -delete

          # 2. Locate and copy ONE canonical real libLLVM shared library for this LLVM version
          echo "Locating canonical libLLVM for LLVM ${{ matrix.llvm }}..."
          REAL_SRC=""
          for cand in \
            "/usr/lib/x86_64-linux-gnu/libLLVM-${{ matrix.llvm }}.so.1" \
            "/usr/lib/x86_64-linux-gnu/libLLVM.so.${{ matrix.llvm }}.1" \
            "/usr/lib/x86_64-linux-gnu/libLLVM-${{ matrix.llvm }}.so" \
            "/usr/lib/x86_64-linux-gnu/libLLVM.so.${{ matrix.llvm }}" \
            "/usr/lib/llvm-${{ matrix.llvm }}/lib/libLLVM.so.${{ matrix.llvm }}.1" \
            "/usr/lib/llvm-${{ matrix.llvm }}/lib/libLLVM-${{ matrix.llvm }}.so" \
            "/usr/lib/llvm-${{ matrix.llvm }}/lib/libLLVM.so"; do
            if [ -e "$cand" ]; then
              resolved=$(readlink -f "$cand")
              if [ -f "$resolved" ]; then
                REAL_SRC="$resolved"
                break
              fi
            fi
          done

          if [ -z "$REAL_SRC" ]; then
            REAL_SRC=$(find /usr/lib -name "libLLVM*${{ matrix.llvm }}*.so*" -type f | head -n 1)
          fi

          echo "Canonical source libLLVM: $REAL_SRC"
          if [ -z "$REAL_SRC" ] || [ ! -f "$REAL_SRC" ]; then
            echo "FATAL: Could not locate libLLVM for LLVM ${{ matrix.llvm }}!"
            exit 1
          fi

          REAL_FILENAME=$(basename "$REAL_SRC")
          echo "Copying $REAL_FILENAME..."
          rm -f "dist/${DIST_NAME}/lib/${REAL_FILENAME}"
          cp "$REAL_SRC" "dist/${DIST_NAME}/lib/${REAL_FILENAME}"
          chmod 755 "dist/${DIST_NAME}/lib/${REAL_FILENAME}"

          # 3. Use ldd from original system binaries to find and copy non-LLVM runtime dependencies
          echo "Resolving dependencies for all binaries..."
          for dep in $(LD_LIBRARY_PATH="/usr/lib/x86_64-linux-gnu:${LLVM_DIR}/lib" ldd "${LLVM_DIR}/bin/"* 2>/dev/null | grep -E "=> (/[^ ]+)" | awk '{print $3}' | sort -u); do
            if [ -e "$dep" ]; then
              base_dep=$(basename "$dep")
              # Don't copy glibc/libm or duplicate libLLVM
              if [[ "$base_dep" != libc.so* && "$base_dep" != libm.so* && "$base_dep" != libpthread.so* && "$base_dep" != libdl.so* && "$base_dep" != libLLVM* ]]; then
                if [[ "$dep" != *"dist/"* ]]; then
                  rm -f "dist/${DIST_NAME}/lib/${base_dep}"
                  cp -aL "$dep" "dist/${DIST_NAME}/lib/" || true
                fi
              fi
            fi
          done

          # 4. Automatically create symlinks for whatever DT_NEEDED name each binary expects
          for bin in dist/${DIST_NAME}/bin/*; do
            if [ -f "$bin" ] && file "$bin" | grep -q "ELF"; then
              for req in $(patchelf --print-needed "$bin" 2>/dev/null | grep "^libLLVM" || true); do
                if [ "$req" != "$REAL_FILENAME" ] && [ ! -e "dist/${DIST_NAME}/lib/$req" ]; then
                  echo "Creating needed link: dist/${DIST_NAME}/lib/$req -> $REAL_FILENAME"
                  ln -sf "$REAL_FILENAME" "dist/${DIST_NAME}/lib/$req"
                fi
              done
            fi
          done

          # 5. Create standard convenience symlinks in lib/
          cd "dist/${DIST_NAME}/lib"
          for alias in \
            "libLLVM.so" \
            "libLLVM.so.1" \
            "libLLVM.so.${{ matrix.llvm }}.1" \
            "libLLVM-${{ matrix.llvm }}.so" \
            "libLLVM-${{ matrix.llvm }}.so.1"; do
            if [ "$alias" != "$REAL_FILENAME" ] && [ ! -e "$alias" ]; then
              ln -sf "$REAL_FILENAME" "$alias"
            fi
          done
          cd -

          # 6. Fix any dangling symlinks in nested directories (such as lldb python modules)
          find "dist/${DIST_NAME}" -name "libLLVM*.so*" -type l | while read -r linkfile; do
            if [ ! -e "$linkfile" ]; then
              rm -f "$linkfile"
              rel_path=$(python3 -c "import os.path; print(os.path.relpath('dist/${DIST_NAME}/lib/${REAL_FILENAME}', os.path.dirname('$linkfile')))")
              ln -sf "$rel_path" "$linkfile"
            fi
          done

          # 7. Ensure unversioned symlinks exist for all tools
          cd "dist/${DIST_NAME}/bin"
          for f in *-${{ matrix.llvm }}; do
            if [ -f "$f" ]; then
              base="${f%-${{ matrix.llvm }}}"
              if [ ! -e "$base" ]; then
                ln -sf "$f" "$base"
              fi
            fi
          done
          cd -

          # 8. Patch RPATH on all binaries and shared libraries
          echo "Patching RPATH on binaries..."
          for f in dist/${DIST_NAME}/bin/*; do
            if [ -f "$f" ] && [ ! -L "$f" ] && file "$f" | grep -q "ELF"; then
              patchelf --set-rpath '$ORIGIN/../lib' "$f" || true
            fi
          done

          echo "Patching RPATH on libraries..."
          for f in dist/${DIST_NAME}/lib/*.so*; do
            if [ -f "$f" ] && [ ! -L "$f" ] && file "$f" | grep -q "ELF"; then
              patchelf --set-rpath '$ORIGIN' "$f" || true
            fi
          done

          # 9. Bundle essential runtime support libs
          for lib in /usr/lib/x86_64-linux-gnu/libtinfo.so.6* /usr/lib/x86_64-linux-gnu/libzstd.so.1* /usr/lib/x86_64-linux-gnu/libxml2.so.2*; do
            if [ -e "$lib" ]; then
              rm -f "dist/${DIST_NAME}/lib/$(basename "$lib")"
              cp -aL "$lib" dist/${DIST_NAME}/lib/ || true
            fi
          done

          # 10. Clean up any remaining dangling links
          find "dist/${DIST_NAME}" -xtype l -delete

          # 11. Create archive
          tar -czvf "${DIST_NAME}.tar.gz" -C dist "${DIST_NAME}"
          sha256sum "${DIST_NAME}.tar.gz" > "${DIST_NAME}.tar.gz.sha256"

      - name: Verify all required tools in unprivileged path
        run: |
          DIST_NAME="llvm-v${{ matrix.llvm }}-linux-x86_64-portable"
          mkdir -p /tmp/test-unprivileged
          tar -xzf "${DIST_NAME}.tar.gz" -C /tmp/test-unprivileged
          BIN="/tmp/test-unprivileged/${DIST_NAME}/bin"
          LIB="/tmp/test-unprivileged/${DIST_NAME}/lib"

          echo "=== Verifying ldd resolution for opt ==="
          ldd "$BIN/opt"
          OPT_LIBLLVM=$(ldd "$BIN/opt" | grep "libLLVM" || true)
          echo "opt resolves libLLVM as: $OPT_LIBLLVM"
          if ! echo "$OPT_LIBLLVM" | grep -q "/tmp/test-unprivileged"; then
            echo "FATAL: opt is not loading libLLVM from the bundled lib directory!"
            exit 1
          fi

          echo "=== Testing required tools ==="
          $BIN/opt --version
          $BIN/llc --version
          $BIN/llvm-as --version
          $BIN/llvm-dis --version
          $BIN/llvm-link --version
          $BIN/llvm-objdump --version
          $BIN/llvm-mc --version

          echo "=== Optional tools check ==="
          if [ -f "$BIN/clang" ]; then $BIN/clang --version; fi
          if [ -f "$BIN/lld" ]; then $BIN/lld --version || true; fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: llvm-v${{ matrix.llvm }}-linux-x86_64-portable
          path: |
            llvm-v${{ matrix.llvm }}-linux-x86_64-portable.tar.gz
            llvm-v${{ matrix.llvm }}-linux-x86_64-portable.tar.gz.sha256

  release:
    needs: package-llvm
    if: ${{ github.repository_owner == 'tgwsaki-meow' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: llvm-v*-linux-x86_64-portable
          merge-multiple: true

      - name: Update GitHub Release with LLVM packages
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v6.0.1-linux-prebuilt
          target_commitish: ${{ github.sha }}
          overwrite_files: true
          files: |
            dist/*.tar.gz
            dist/*.sha256
