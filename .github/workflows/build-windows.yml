name: Build Remill (Windows x86_64)

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build_windows:
    name: Build Windows x86_64 (LLVM ${{ matrix.llvm }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        llvm: ["20"]
        include:
          - llvm: "20"
            llvm_release_tag: "llvmorg-20.1.0"
            llvm_asset_name: "clang+llvm-20.1.0-x86_64-pc-windows-msvc.tar.xz"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Ninja
        shell: pwsh
        run: |
          choco install ninja --no-progress
          & ninja --version

      - name: Configure Git
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Download and setup LLVM ${{ matrix.llvm }}
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          New-Item -ItemType Directory -Path "D:\llvm" -Force
          $llvmTar = "$env:RUNNER_TEMP\llvm.tar.xz"
          Write-Host "Downloading LLVM ${{ matrix.llvm }} from ${{ matrix.llvm_release_tag }}..."
          gh release download ${{ matrix.llvm_release_tag }} --repo llvm/llvm-project --pattern "${{ matrix.llvm_asset_name }}" --output $llvmTar
          Write-Host "Extracting LLVM to D:\llvm..."
          tar -xf $llvmTar -C "D:\llvm" --strip-components=1
          Remove-Item $llvmTar

          "D:\llvm\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "LLVM_DIR=D:/llvm/lib/cmake/llvm" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LLVM_PREFIX=D:/llvm" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify build environment
        shell: pwsh
        run: |
          & clang-cl.exe --version
          & llvm-link.exe --version
          & cmake.exe --version
          & ninja.exe --version
          & cl.exe 2>&1 | Select-Object -First 1

      - name: Build dependencies
        shell: pwsh
        run: |
          cmake -G Ninja -S dependencies -B dependencies/build `
            -DUSE_EXTERNAL_LLVM=ON `
            -DENABLE_SLEIGH=ON `
            "-DCMAKE_PREFIX_PATH:PATH=D:/llvm" `
            -DCMAKE_C_COMPILER=clang-cl `
            -DCMAKE_CXX_COMPILER=clang-cl `
            -DCMAKE_BUILD_TYPE=Release
          cmake --build dependencies/build

      - name: Build Remill
        shell: pwsh
        run: |
          cmake -G Ninja -B build `
            -DREMILL_FETCH_SLEIGH=OFF `
            "-DCMAKE_PREFIX_PATH:PATH=$PWD/dependencies/install;D:/llvm" `
            "-DCMAKE_INSTALL_PREFIX=$PWD/install" `
            -DCMAKE_C_COMPILER=clang-cl `
            -DCMAKE_CXX_COMPILER=clang-cl `
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Install Remill
        shell: pwsh
        run: |
          cmake --install build
          if (Test-Path "install/bin/remill-lift-${{ matrix.llvm }}.exe") {
              Copy-Item "install/bin/remill-lift-${{ matrix.llvm }}.exe" "install/bin/remill-lift.exe" -Force
          }

      - name: Smoketests with installed executable
        shell: pwsh
        run: |
          $liftExe = "install/bin/remill-lift.exe"
          Write-Host "Testing Remill Lift execution..."
          & $liftExe --version || Write-Host "Version flag returned non-zero (expected for gflags without --version handler)"

          Write-Host "Testing AMD64 lift..."
          & $liftExe --arch amd64 --ir_out test_amd64.ll --bytes c704ba01000000
          if (!(Test-Path test_amd64.ll)) {
              throw "AMD64 lift failed: test_amd64.ll not created"
          }
          Write-Host "AMD64 lift SUCCESS! Output preview:"
          Get-Content test_amd64.ll -TotalCount 25

          Write-Host "Testing AArch64 lift..."
          & $liftExe --arch aarch64 --ir_out test_aarch64.ll --address 0x400544 --bytes FD7BBFA90000009000601891FD030091B7FFFF97E0031F2AFD7BC1A8C0035FD6
          if (!(Test-Path test_aarch64.ll)) {
              throw "AArch64 lift failed: test_aarch64.ll not created"
          }
          Write-Host "AArch64 lift SUCCESS!"

      - name: Package Windows Release Archive
        shell: pwsh
        run: |
          $pkgName = "remill-v6.0.1-windows-x86_64-llvm${{ matrix.llvm }}"
          $destDir = "$pkgName"
          New-Item -ItemType Directory -Path $destDir -Force
          Copy-Item -Path "install\*" -Destination $destDir -Recurse -Force
          
          # Include license and readme
          Copy-Item "LICENSE" "$destDir\" -Force
          Copy-Item "README.md" "$destDir\" -Force

          # Create zip package
          $zipName = "$pkgName.zip"
          Compress-Archive -Path "$destDir\*" -DestinationPath $zipName -Force

          # Compute SHA-256
          $sha256 = (Get-FileHash $zipName -Algorithm SHA256).Hash.ToLower()
          "$sha256  $zipName" | Out-File -FilePath "$zipName.sha256" -Encoding utf8

          Write-Host "Created archive: $zipName ($((Get-Item $zipName).Length / 1MB) MB)"
          Write-Host "SHA256: $sha256"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: remill-windows-x86_64-llvm${{ matrix.llvm }}
          path: |
            remill-v6.0.1-windows-x86_64-llvm*.zip
            remill-v6.0.1-windows-x86_64-llvm*.zip.sha256

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $files = (Get-ChildItem -Path remill-v6.0.1-windows-x86_64-llvm*.zip*).FullName
          gh release create v6.0.1-windows-prebuilt $files `
            --title "Remill v6.0.1 Windows x86_64 Prebuilt Release" `
            --notes "Precompiled standalone rootless Remill v6.0.1 for Windows 10/11 x86_64 with LLVM 20. Self-contained architecture semantics and Sleigh Ghidra specs included with automatic relative path discovery." || `
          gh release upload v6.0.1-windows-prebuilt $files --clobber
